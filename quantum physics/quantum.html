<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Quantum Made Easy for Beginners</title>
    <style>
        /* Reset some default spacing */
        body, h1, h2, a {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #e0e0e0;
            text-align: center;
            padding: 60px 30px;
            line-height: 1.6;
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            margin-bottom: 0.5em;
            text-transform: uppercase;
            color: #f0c419;
            text-shadow: 3px 3px 8px #000a;
        }

        h2 {
            font-weight: 600;
            font-size: 2.2rem;
            margin: 1em auto 1.5em;
            max-width: 800px;
            color: #cbd5e0;
        }

        img {
            max-width: 95vw;
            height: auto;
            margin: 3em 0;
            border-radius: 15px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.07);
        }

        a {
            display: inline-block;
            margin-top: 2em;
            font-size: 2.2rem;
            color: #f0c419;
            text-decoration: none;
            font-weight: 700;
            border: 3px solid #f0c419;
            padding: 0.75em 2.5em;
            border-radius: 35px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a:hover {
            background-color: #f0c419;
            color: #1b1b1b;
            box-shadow: 0 6px 20px #f0c419bb;
        }
    </style>
</head>
<body>
    <h1>QUANTUM PHYSICS FOR BEGINNERS</h1>
    <h2>Unlocking the Mysteries of the Universe!</h2>
    <img src="Quantum.png" alt="Quantum symbol" />
    <h2>The study of quantum physics opens the door to a universe far more mysterious and beautiful than we ever imagined</h2>

</body>
</html>
